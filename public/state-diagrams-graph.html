<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State Diagrams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:sans-serif;overflow:hidden}
#h{padding:10px 16px;background:rgba(10,10,26,.9);border-bottom:1px solid #1a1a3a;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:10}
#h h1{font-size:16px;color:#3b82f6}
#h .b{color:#888;font-size:12px}
svg{width:100vw;height:100vh;display:block}
.nd circle{stroke:#fff;stroke-width:1;cursor:pointer}
.nd text{font-size:9px;fill:#ccc;pointer-events:none}
.lk{stroke:rgba(58,58,106,.3);stroke-width:.5}
#tp{position:fixed;z-index:20;background:rgba(20,20,50,.95);border:1px solid #3a3a6a;border-radius:8px;padding:8px 12px;font-size:12px;display:none;pointer-events:none;max-width:280px}
#tp .lb{color:#3b82f6;font-weight:bold}
#tp .ty{color:#888;font-size:10px}
</style>
</head>
<body>
<div id=h><h1>📐 State Diagrams</h1><span class=b>29n 26e</span></div>
<div id=tp></div>
<svg id=g></svg>
<script>
// Minimal force layout - no D3 dependency
const N=[{"id": "StateMachine", "label": "State Machine", "type": "concept"}, {"id": "State", "label": "State", "type": "concept"}, {"id": "Event", "label": "Event", "type": "concept"}, {"id": "GuardCondition", "label": "Guard Condition", "type": "concept"}, {"id": "Transition", "label": "Transition", "type": "concept"}, {"id": "Activity", "label": "Activity", "type": "concept"}, {"id": "Action", "label": "Action", "type": "concept"}, {"id": "InitialState", "label": "Initial State", "type": "concept"}, {"id": "FinalState", "label": "Final State", "type": "concept"}, {"id": "CompositeState", "label": "Composite State", "type": "concept"}, {"id": "SuperState", "label": "Super-State", "type": "concept"}, {"id": "SubState", "label": "Sub-State", "type": "concept"}, {"id": "ConcurrentSubStates", "label": "Concurrent Sub-States", "type": "concept"}, {"id": "Regions", "label": "Regions", "type": "concept"}, {"id": "HistoryState", "label": "History State", "type": "concept"}, {"id": "ActivityDiagram", "label": "Activity Diagram", "type": "concept"}, {"id": "Class", "label": "Class", "type": "concept"}, {"id": "Toaster", "label": "Toaster", "type": "example"}, {"id": "Off", "label": "Off", "type": "example"}, {"id": "On", "label": "On", "type": "example"}, {"id": "Working", "label": "Working", "type": "example"}, {"id": "Idle", "label": "Idle", "type": "example"}, {"id": "Burned", "label": "Burned", "type": "example"}, {"id": "AIModelingTools", "label": "AI Modeling Tools", "type": "tool"}, {"id": "AIChatbot", "label": "AI Chatbot", "type": "tool"}, {"id": "StateNotation", "label": "State (rectangle with rounded corners)", "type": "notation"}, {"id": "TransitionNotation", "label": "Transition (solid directed line)", "type": "notation"}, {"id": "HistoryStateNotation", "label": "History State (circle with H inside)", "type": "notation"}, {"id": "ConcurrentRegionsNotation", "label": "Concurrent Regions (separated by dashed line)", "type": "notation"}];
const E=[{"source": "StateMachine", "target": "State", "relation": "contains"}, {"source": "StateMachine", "target": "Event", "relation": "responds to"}, {"source": "StateMachine", "target": "Transition", "relation": "contains"}, {"source": "StateMachine", "target": "InitialState", "relation": "starts with"}, {"source": "StateMachine", "target": "FinalState", "relation": "ends with"}, {"source": "State", "target": "CompositeState", "relation": "can be"}, {"source": "CompositeState", "target": "SubState", "relation": "contains"}, {"source": "CompositeState", "target": "ConcurrentSubStates", "relation": "supports"}, {"source": "ConcurrentSubStates", "target": "Regions", "relation": "separated by"}, {"source": "CompositeState", "target": "HistoryState", "relation": "can have"}, {"source": "Transition", "target": "Event", "relation": "triggered by"}, {"source": "Transition", "target": "GuardCondition", "relation": "conditioned by"}, {"source": "Transition", "target": "State", "relation": "connects"}, {"source": "ActivityDiagram", "target": "StateMachine", "relation": "reducible to"}, {"source": "StateDiagram", "target": "Class", "relation": "associated with"}, {"source": "Toaster", "target": "Off", "relation": "has state"}, {"source": "Toaster", "target": "On", "relation": "has state"}, {"source": "Toaster", "target": "Working", "relation": "has state"}, {"source": "Toaster", "target": "Idle", "relation": "has state"}, {"source": "Toaster", "target": "Burned", "relation": "has state"}, {"source": "Working", "target": "measure temperature", "relation": "has sub-state"}, {"source": "Working", "target": "compare with upper limit", "relation": "has sub-state"}, {"source": "Idle", "target": "measure temperature", "relation": "has sub-state"}, {"source": "Idle", "target": "compare with lower limit", "relation": "has sub-state"}, {"source": "AIModelingTools", "target": "StateDiagram", "relation": "generates"}, {"source": "AIChatbot", "target": "StateDiagram", "relation": "refines"}];
const C={"concept":"#3b82f6","notation":"#8b5cf6","relationship":"#10b981","example":"#f59e0b","tool":"#ec4899"};

const W=window.innerWidth,H=window.innerHeight;
const svg=document.getElementById('g');
const ns=new Map(),ls=new Set();

N.forEach((n,i)=>{n.x=W/2+(Math.random()-.5)*W*.6;n.y=H/2+(Math.random()-.5)*H*.6;ns.set(n.id,n)};
E.forEach(e=>{ls.add(e.source);ls.add(e.target)});

// Simple force simulation (100 iterations)
for(let t=0;t<150;t++){
  E.forEach(e=>{let s=ns.get(e.source),t=ns.get(e.target);if(s&&t){let dx=t.x-s.x,dy=t.y-s.y,d=Math.sqrt(dx*dx+dy*dy)||1;let f=(d-130)*.005;s.x+=f*dx/d;s.y+=f*dy/d;t.x-=f*dx/d;t.y-=f*dy/d}});
  N.forEach((n,i)=>{N.forEach((m,j)=>{if(i!==j){let dx=m.x-n.x,dy=m.y-n.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<35){let f=(35-d)*.03;n.x-=f*dx/d;n.y-=f*dy/d;m.x+=f*dx/d;m.y+=f*dy/d}}})});
  N.forEach(n=>{n.x+=((W/2)-n.x)*.001;n.y+=((H/2)-n.y)*.001});
}

// Render SVG
let svgContent='';
E.forEach(e=>{let s=ns.get(e.source),t=ns.get(e.target);if(s&&t)svgContent+=`<line class=lk x1=${s.x} y1=${s.y} x2=${t.x} y2=${t.y}/>`});
N.forEach(n=>{svgContent+=`<g class=nd transform=translate(${n.x},${n.y})>`+(ls.has(n.id)?`<circle r=8 fill=${C[n.type]||'#666'}/>`:`<circle r=4 fill=#444/>`)+`<text dx=12 dy=3 opacity=${ls.has(n.id)?1:.3}>${n.label||n.id}</text></g>`});
svg.innerHTML=svgContent;

// Tooltip
const tp=document.getElementById('tp');
svg.querySelectorAll('.nd').forEach((el,i)=>{
  el.addEventListener('mouseover',function(e){
    const n=N[i];tp.style.display='block';tp.innerHTML='<div class=lb>'+(n.label||n.id)+'</div><div class=ty>'+(n.type||'')+'</div>';tp.style.left=(e.pageX+12)+'px';tp.style.top=(e.pageY-8)+'px';
    this.querySelector('circle').setAttribute('r',ls.has(n.id)?12:6);
  });
  el.addEventListener('mouseout',function(){
    tp.style.display='none';const n=N[i];this.querySelector('circle').setAttribute('r',ls.has(n.id)?8:4);
  });
});
</script>
</body>
</html>
