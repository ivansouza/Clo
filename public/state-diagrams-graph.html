<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>State Diagrams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;color:#fff;font-family:sans-serif;overflow:hidden}
#h{padding:8px 12px;background:#0f0f2a;border-bottom:1px solid #1a1a3a;display:flex;align-items:center;gap:8px}
#h h1{font-size:14px;color:#3b82f6}
#h .b{color:#888;font-size:11px}
svg{width:100%;height:calc(100vh - 41px);background:#0a0a1a;display:block}
.nd circle{stroke:rgba(255,255,255,.2);stroke-width:.5;cursor:grab}
.nd text{font-size:8px;fill:#aaa;pointer-events:none;user-select:none}
.lk{stroke:rgba(58,58,106,.2);stroke-width:.5}
#tp{position:fixed;z-index:20;background:rgba(20,20,50,.95);border:1px solid #3a3a6a;border-radius:6px;padding:6px 10px;font-size:11px;display:none;pointer-events:none;max-width:220px}
#tp .lb{color:#3b82f6;font-weight:bold;font-size:12px}
#tp .ty{color:#888;font-size:9px}
</style>
</head>
<body>
<div id=h><h1>📐 State Diagrams</h1><span class=b>29n 19e</span></div>
<svg id=g xmlns="http://www.w3.org/2000/svg"></svg>
<div id=tp></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
var N=[{"id": "StateMachine", "label": "State Machine", "type": "concept"}, {"id": "State", "label": "State", "type": "concept"}, {"id": "Event", "label": "Event", "type": "concept"}, {"id": "GuardCondition", "label": "Guard Condition", "type": "concept"}, {"id": "Transition", "label": "Transition", "type": "concept"}, {"id": "Activity", "label": "Activity", "type": "concept"}, {"id": "Action", "label": "Action", "type": "concept"}, {"id": "InitialState", "label": "Initial State", "type": "concept"}, {"id": "FinalState", "label": "Final State", "type": "concept"}, {"id": "CompositeState", "label": "Composite State", "type": "concept"}, {"id": "SuperState", "label": "Super-State", "type": "concept"}, {"id": "SubState", "label": "Sub-State", "type": "concept"}, {"id": "ConcurrentSubStates", "label": "Concurrent Sub-States", "type": "concept"}, {"id": "Regions", "label": "Regions", "type": "concept"}, {"id": "HistoryState", "label": "History State", "type": "concept"}, {"id": "ActivityDiagram", "label": "Activity Diagram", "type": "concept"}, {"id": "Class", "label": "Class", "type": "concept"}, {"id": "Toaster", "label": "Toaster", "type": "example"}, {"id": "Off", "label": "Off", "type": "example"}, {"id": "On", "label": "On", "type": "example"}, {"id": "Working", "label": "Working", "type": "example"}, {"id": "Idle", "label": "Idle", "type": "example"}, {"id": "Burned", "label": "Burned", "type": "example"}, {"id": "AIModelingTools", "label": "AI Modeling Tools", "type": "tool"}, {"id": "AIChatbot", "label": "AI Chatbot", "type": "tool"}, {"id": "StateNotation", "label": "State (rectangle with rounded corners)", "type": "notation"}, {"id": "TransitionNotation", "label": "Transition (solid directed line)", "type": "notation"}, {"id": "HistoryStateNotation", "label": "History State (circle with H inside)", "type": "notation"}, {"id": "ConcurrentRegionsNotation", "label": "Concurrent Regions (separated by dashed line)", "type": "notation"}];
var E=[{"source": "StateMachine", "target": "State", "relation": "contains"}, {"source": "StateMachine", "target": "Event", "relation": "responds to"}, {"source": "StateMachine", "target": "Transition", "relation": "contains"}, {"source": "StateMachine", "target": "InitialState", "relation": "starts with"}, {"source": "StateMachine", "target": "FinalState", "relation": "ends with"}, {"source": "State", "target": "CompositeState", "relation": "can be"}, {"source": "CompositeState", "target": "SubState", "relation": "contains"}, {"source": "CompositeState", "target": "ConcurrentSubStates", "relation": "supports"}, {"source": "ConcurrentSubStates", "target": "Regions", "relation": "separated by"}, {"source": "CompositeState", "target": "HistoryState", "relation": "can have"}, {"source": "Transition", "target": "Event", "relation": "triggered by"}, {"source": "Transition", "target": "GuardCondition", "relation": "conditioned by"}, {"source": "Transition", "target": "State", "relation": "connects"}, {"source": "ActivityDiagram", "target": "StateMachine", "relation": "reducible to"}, {"source": "Toaster", "target": "Off", "relation": "has state"}, {"source": "Toaster", "target": "On", "relation": "has state"}, {"source": "Toaster", "target": "Working", "relation": "has state"}, {"source": "Toaster", "target": "Idle", "relation": "has state"}, {"source": "Toaster", "target": "Burned", "relation": "has state"}];
var C={"concept":"#3b82f6","notation":"#8b5cf6","relationship":"#10b981","example":"#f59e0b","tool":"#ec4899"};
var W=window.innerWidth,H=window.innerHeight;
var svg=d3.select('#g'),G=svg.append('g');
var zm=d3.zoom().scaleExtent([.3,4]).on('zoom',e=>G.attr('transform',e.transform));
svg.call(zm);
var ls=new Set();E.forEach(e=>{ls.add(e.source);ls.add(e.target)});
var GN=N.map(function(n,i){return{...n,x:W/2+(Math.random()-.5)*W*.4,y:20+(i/N.length)*H*.9+(Math.random()-.5)*30}});
var GE=E.map(function(e){return{source:e.source,target:e.target}});
var sim=d3.forceSimulation(GN).force('link',d3.forceLink(GE).id(function(d){return d.id}).distance(100).strength(.3)).force('charge',d3.forceManyBody().strength(-200)).force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide().radius(function(d){return 20+(d.label?d.label.length*2.5:8)})).alphaDecay(.02);
var lk=G.append('g').selectAll('line').data(GE).join('line').attr('class','lk');
var nd=G.append('g').selectAll('g').data(GN).join('g').attr('class','nd').call(d3.drag().on('start',function(e,d){if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',function(e,d){d.fx=e.x;d.fy=e.y}).on('end',function(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
nd.append('circle').attr('r',function(d){return ls.has(d.id)?7:3}).attr('fill',function(d){return ls.has(d.id)?(C[d.type]||'#666'):'#333'});
nd.append('text').text(function(d){return d.label||d.id}).attr('dx',10).attr('dy',3).attr('opacity',function(d){return ls.has(d.id)?1:.3});
var tp=d3.select('#tp');
nd.on('mouseover',function(e,d){tp.style('display','block').html('<div class=lb>'+(d.label||d.id)+'</div><div class=ty>'+(d.type||'')+'</div>').style('left',Math.min(e.pageX+10,window.innerWidth-230)+'px').style('top',Math.min(e.pageY-5,window.innerHeight-60)+'px');d3.select(e.target.closest('.nd')).select('circle').attr('r',ls.has(d.id)?11:5)}).on('mouseout',function(e,d){tp.style('display','none');d3.select(this).select('circle').attr('r',ls.has(d.id)?7:3)});
sim.on('tick',function(){lk.attr('x1',function(d){return d.source.x}).attr('y1',function(d){return d.source.y}).attr('x2',function(d){return d.target.x}).attr('y2',function(d){return d.target.y});nd.attr('transform',function(d){return'translate('+d.x+','+d.y+')'})});
</script>
</body>
</html>
